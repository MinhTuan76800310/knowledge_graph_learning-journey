# book-manifest.yaml — ordered list of manuscript sources for the English PDF build.
# scripts/build_book.sh reads this (when LANG=en) to assemble the book in order.
#
# English edition is built incrementally, mirroring the Vietnamese release order.
# Currently: Chapters 1-7 (English preview).

book:
  output_name: knowledge-graph-book-en

# Files are relative to the book-en/ directory, in reading order.
sources:
  - chapter01.md
  - chapter02.md
  - chapter03.md
  - chapter04.md
  - chapter05.md
  - chapter06.md
  - chapter07.md

# Chapters not yet translated (added as they reach DRAFTED):
# - preface.md, how-to-use.md, introduction.md
# - chapter08.md ... chapter10.md
# - afterword.md, glossary.md
