# Concept Dependency Registry — Knowledge Graph Book
# Tracks when each concept is first MENTIONED, first REQUIRED, and first EXPLAINED.
#
# Field semantics:
#   first_mentioned_chapter:    first textual appearance (may be incidental)
#   first_required_use_chapter: first chapter where reader MUST understand the concept
#   first_explained_chapter:    chapter where mechanism-level teaching occurs
#   incidental_gloss:           whether pre-explanation mentions include a minimum local gloss
#   explanation_level:          intuition | mechanism | application
#
# Invariants enforced by tests/test_book_concept_dependencies.py:
#   1. first_explained_chapter <= first_required_use_chapter
#      (cannot require understanding before teaching)
#   2. if first_mentioned_chapter < first_explained_chapter then incidental_gloss == true
#      (early mentions must carry a local gloss)
#   3. first_mentioned_chapter <= first_required_use_chapter
#      (cannot require something before it's even mentioned)

