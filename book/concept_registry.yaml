# Concept Dependency Registry — Knowledge Graph Book
# Tracks when each concept is first USED (mentioned in a way that requires understanding)
# vs first EXPLAINED (taught at mechanism level per BOOK_PEDAGOGY.md §4).
#
# Invariants enforced by tests/test_book_concept_dependencies.py:
#   - first_used_chapter <= first_explained_chapter (no unexplained usage)
#   - If first_used_chapter < first_explained_chapter, incidental_gloss must be true
#   - Every concept has both fields populated
#
# Levels: intuition | mechanism | application (per BOOK_PEDAGOGY.md §4)

concepts:
