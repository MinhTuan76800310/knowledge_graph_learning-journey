# book-manifest.yaml — ordered list of manuscript sources for the PDF build.
# scripts/build_book.sh reads this to assemble the book in the correct order.
#
# For Book Preview v0.2 we build: front matter + Chapters 1-3 + Glossary.
# As Chapters 4-10 are completed, append them here in order.

book:
  output_name: knowledge-graph-book

# Files are relative to the book/ directory, in reading order.
sources:
  - preface.md
  - how-to-use.md
  - introduction.md
  - chapter01.md
  - chapter02.md
  - chapter03.md
  - chapter04.md
  - chapter05.md
  - chapter06.md
  - chapter07.md
  - chapter08.md
  - chapter09.md
  - glossary.md

# Chapters not yet in the book (added as they reach DRAFTED):
# - chapter10.md
# - afterword.md
