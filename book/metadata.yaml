# Metadata for the Knowledge Graph book PDF build (Pandoc).
# Consumed by scripts/build_book.sh.

title: "Knowledge Graph: Từ Đồ thị đến Hệ thống Tri thức"
subtitle: "Một giáo trình mã nguồn mở"
author: "Các tác giả Knowledge Graph Book"
date: "2026"
lang: vi

# Bibliography / citations (Pandoc citeproc)
bibliography: references.bib
csl: ieee.csl
link-citations: true
reference-section-title: "Tài liệu tham khảo"

# Table of contents
toc: true
toc-depth: 2

# Document class: book gives real \chapter breaks (each chapter starts on a
# new page). openany avoids forced blank verso pages in the preview build.
documentclass: book
classoption:
  - openany

# PDF engine (lualatex handles Vietnamese Unicode via fontspec; xelatex is
# not installed on the build machine — documented substitution).
pdf-engine: lualatex
